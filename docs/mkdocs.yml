site_name: Archi Docs
nav:
  - Home: index.md
  - Glossary: glossary.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Secrets: secrets.md
  - User Guide: user_guide.md
  - Data Sources: data_sources.md
  - Services: services.md
  - Models & Providers: models_providers.md
  - Agents & Tools: agents_tools.md
  - Configuration: configuration.md
  - CLI Reference: cli_reference.md
  - API Reference: api_reference.md
  - Benchmarking: benchmarking.md
  - Interpreting Results: interpreting_benchmark_results.md
  - Advanced Setup: advanced_setup_deploy.md
  - Adding Providers: adding_providers.md
  - Developer Guide: developer_guide.md
  - Troubleshooting: troubleshooting.md
  - vLLM Failure Modes: vllm_issues.md
theme: readthedocs
markdown_extensions:
  # Renders `!!! note` / `!!! warning` callouts. Without this they appear as
  # literal text (agents_tools.md and interpreting_benchmark_results.md use them).
  - admonition
  # `abbr` + snippets auto-append render glossary acronyms (RAG, MRR, FASRC, …) as
  # <abbr> hover tooltips on EVERY page from one shared file, with no per-page edits.
  # Two base_path roots so the shared file resolves whether the build runs from the
  # repo root (CI: `mkdocs build --config-file docs/mkdocs.yml`) or from docs/
  # (local: `cd docs && mkdocs serve`).
  - abbr
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
      base_path:
        - docs/docs
        - docs
repo_url: https://github.com/archi-physics/archi
repo_name: 'GitHub'
