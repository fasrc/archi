name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Fast feedback (parallel) ────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install formatting tools
        run: pip install black==24.10.0 isort==6.0.1

      # Scope == the dirs normalized in #69 and enforced by scripts/gate.sh (src/ incl
      # src/bin, tests/, scripts/). Keep these three in lockstep so they never drift.
      - name: Check formatting with Black
        run: black --check src tests scripts

      - name: Check import ordering with isort
        run: isort --check-only src tests scripts

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . || true
          pip install -r requirements/requirements-base.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

  # ── Build base images (only when inputs change) ─────────────────────
  build-base-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      ARCHI_DIR: ${{ github.workspace }}/archi-local

    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect base image changes
        id: detect
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAIN_REF: main
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$MAIN_REF"
          FILES="$(git diff --name-only "origin/${MAIN_REF}...HEAD" || true)"
          TAG="pr-${PR_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          PATTERN='^(requirements/(?:cpu|gpu)-requirementsHEADER\.txt|requirements/requirements-base\.txt|src/cli/templates/dockerfiles/base-[^/]+/Dockerfile)'
          if [[ -z "$FILES" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$FILES" | grep -E "$PATTERN" >/dev/null; then
            echo "Base image inputs changed:"
            echo "$FILES" | grep -E "$PATTERN"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install archi CLI
        if: steps.detect.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ".[all]" || pip install .

      - name: Ensure build scripts are executable
        if: steps.detect.outputs.changed == 'true'
        run: chmod +x scripts/dev/*.sh

      - name: Build updated base images
        if: steps.detect.outputs.changed == 'true'
        run: |
          # Only build python base for PR preview (pytorch not used in smoke tests)
          scripts/dev/build_docker_images.sh -i a2rchi/a2rchi-python-base "${{ steps.detect.outputs.tag }}"

      - name: Log in to GHCR
        if: steps.detect.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish updated base image
        if: steps.detect.outputs.changed == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PUSH_LATEST: "false"
        run: scripts/dev/push_docker_images.sh -i a2rchi/a2rchi-python-base "${{ steps.detect.outputs.tag }}"

  # ── Smoke deployment + integration tests ────────────────────────────
  preview:
    runs-on: ubuntu-latest
    needs: build-base-images
    permissions:
      contents: read
      pull-requests: write
      packages: read
    env:
      ARCHI_DIR: ${{ github.workspace }}/archi-local
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Decide whether this PR's changed files can affect the smoke deployment or
      # the Playwright UI suite. A docs-/openspec-/unit-test-only PR skips both
      # expensive stages (#87). Reuses the `git diff --name-only` pattern from
      # build-base-images above — no new marketplace action.
      #
      # Correctness over speed: if the changed-file list can't be computed (shallow
      # clone, diff error), both flags default to true so the full suite runs. The
      # `preview` job itself always runs and succeeds, so gating steps (not the whole
      # job) keeps any required-status-check behaviour intact.
      - name: Detect changed paths
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF" || true
          FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD" || true)"
          if [ -z "$FILES" ]; then
            echo "Changed-file list empty/uncomputable -> running the full suite (fail-safe)."
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            echo "ui=true"      >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; echo "$FILES"
          # Smoke-deploy-relevant (runtime) paths. scripts/dev/ is included because
          # the run-smoke action executes scripts/dev/run_smoke_preview.sh and the
          # build/publish jobs call build_docker_images.sh / push_docker_images.sh /
          # update_service_base_images.py — editing any of those changes the smoke
          # path itself, so a PR touching them must NOT skip the smoke deploy.
          # tests/smoke/ for the same reason, one level down: run_smoke_preview.sh
          # executes tests/smoke/combined_smoke.sh, so a PR editing the smoke suite
          # itself would otherwise skip the very stage it changes.
          runtime_re='^(src/|deploy/|requirements/|pyproject\.toml|.*Dockerfile[^/]*$|scripts/dev/|tests/smoke/|tests/pr_preview_config/|\.github/actions/run-smoke/|\.github/workflows/pr-preview\.yml)'
          # Playwright/UI-relevant paths.
          ui_re='^(src/interfaces/chat_app/static/|src/interfaces/chat_app/templates/|tests/ui/|playwright\.config\.ts|package(-lock)?\.json|\.github/actions/run-smoke/)'
          runtime=false; ui=false
          # Here-strings, NOT `echo "$FILES" | grep -q`. `grep -q` exits on its first
          # match, and on a large changed-file list that closes the pipe while echo is
          # still writing: echo takes SIGPIPE (141), `set -o pipefail` makes the whole
          # pipeline non-zero even though grep MATCHED, and the `|| true` then swallows
          # it — leaving the flag false. That fails OPEN: a PR touching src/ would skip
          # the smoke deploy. Reproduced with a 3.9 MB list and a matching path first:
          # piped form gave runtime=false, here-string gave runtime=true.
          if grep -qE "$runtime_re" <<<"$FILES"; then runtime=true; fi
          if grep -qE "$ui_re" <<<"$FILES"; then ui=true; fi
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "ui=$ui"           >> "$GITHUB_OUTPUT"
          echo "Decision: runtime=$runtime ui=$ui"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install archi CLI
        run: |
          python -m pip install --upgrade pip
          pip install ".[all]" || pip install .
          # The base runtime stack (flask, langchain, etc.) lives in requirements-base.txt,
          # not in pyproject.toml. The preview job runs `archi create`, which imports the
          # full Python runtime, so install requirements-base too.
          pip install -r requirements/requirements-base.txt
          python -c "import importlib.util, mkdocs; assert importlib.util.find_spec('mkdocs.__main__'), 'mkdocs.__main__ missing'; print('mkdocs:', mkdocs.__version__)"

      - name: Install Ollama and pull model
        if: steps.detect.outputs.runtime == 'true' || steps.detect.outputs.ui == 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama is ready"
              break
            fi
            sleep 1
          done
          ollama pull qwen3:4b

      - name: Disable Docker containerd image store
        if: steps.detect.outputs.runtime == 'true' || steps.detect.outputs.ui == 'true'
        run: |
          # Docker on ubuntu-latest uses containerd image store by default.
          # This causes "already exists" errors when multiple compose services
          # share the same image name (e.g. config-seed reuses chatbot image).
          # Must overwrite daemon.json AND remove drop-in dir to fully revert.
          echo '{"features":{"containerd-snapshotter":false}}' | sudo tee /etc/docker/daemon.json
          sudo rm -rf /etc/docker/daemon.json.d
          sudo systemctl restart docker
          docker info | grep -i "Storage Driver"

      # Unconditional since fasrc/archi#266: the service templates now build FROM
      # ghcr.io/fasrc/a2rchi-*-base, and those packages are `internal`, so an anonymous
      # pull is refused. Gating this on build-base-images.changed would leave every PR
      # that does not touch a base-image input unable to pull the base it builds on --
      # which is most of them. The job already holds `packages: read`.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull updated base image from GHCR
        if: needs.build-base-images.outputs.changed == 'true'
        env:
          TAG: ${{ needs.build-base-images.outputs.tag }}
        run: docker pull "ghcr.io/fasrc/a2rchi-python-base:${TAG}"

      - name: Prepare base image references
        if: needs.build-base-images.outputs.changed == 'true'
        run: python scripts/dev/update_service_base_images.py --tag "${{ needs.build-base-images.outputs.tag }}" --switch-source ghcr --orig-tag all

      - name: Verify MkDocs build
        run: mkdocs build --config-file docs/mkdocs.yml --strict

      - name: Clean up MkDocs build artifacts
        run: rm -rf site

      - name: Run smoke deployment
        if: steps.detect.outputs.runtime == 'true' || steps.detect.outputs.ui == 'true'
        uses: ./.github/actions/run-smoke
        with:
          deployment-name: ci-${{ github.run_id }}
          config-path: tests/pr_preview_config/pr_preview_config.yaml
          config-destination: configs/ci/ci_config.generated.yaml
          services: chatbot
          hostmode: "true"
          wait-url: http://localhost:2786/api/health
          base-url: http://localhost:2786
          extra-env: |
            ARCHI_COMPOSE_UP_FLAGS=--build --force-recreate
            SMOKE_OLLAMA_MODEL=qwen3:4b
            SMOKE_OLLAMA_URL=http://localhost:11434
            SMOKE_OLLAMA_HOST=http://localhost:11434
            SMOKE_CLEANUP=false
          use-podman: "false"

      # ── Playwright UI tests (run in same job; deployment is on localhost) ──
      # Gated on the same signal as the smoke deploy: the UI suite needs the
      # deployed app up, and a backend-only change can still break the UI, so run
      # Playwright whenever the app was deployed (runtime OR ui).
      - name: Set up Node.js
        if: steps.detect.outputs.runtime == 'true' || steps.detect.outputs.ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        if: steps.detect.outputs.runtime == 'true' || steps.detect.outputs.ui == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.detect.outputs.runtime == 'true' || steps.detect.outputs.ui == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        if: steps.detect.outputs.runtime == 'true' || steps.detect.outputs.ui == 'true'
        env:
          BASE_URL: http://localhost:2786
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ always() && (steps.detect.outputs.runtime == 'true' || steps.detect.outputs.ui == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # ── Cleanup ─────────────────────────────────────────────────────────
      - name: Cleanup smoke deployment
        if: ${{ always() && (steps.detect.outputs.runtime == 'true' || steps.detect.outputs.ui == 'true') }}
        run: |
          yes | archi delete --name ci-${{ github.run_id }} || true

      - name: Cleanup local base images
        if: ${{ always() && needs.build-base-images.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          TAG="${{ needs.build-base-images.outputs.tag }}"
          echo "Cleaning up local base images with tag: $TAG"
          docker rmi "ghcr.io/fasrc/a2rchi-python-base:${TAG}" || true
          docker rmi "a2rchi/a2rchi-python-base:${TAG}" || true
          echo "Cleanup complete"
