# .github/workflows/pr-readiness-labels.yml — keep the PR index honest.
#
# The GitHub PR list renders the CI check rollup but never renders mergeability,
# so a conflicted PR with green checks looks IDENTICAL in the list to one that is
# genuinely ready to merge. On 2026-07-31 that hid a single deleted symlink
# (issue #168) which had left 6 of 7 open PRs unmergeable while every check
# stayed green and the nightly kept answering review findings that could never
# land. Labels are the only readiness signal the index renders, so this reconciles
# two of them on every event Actions can actually be triggered by, plus an hourly
# sweep — which is load-bearing, not decorative, because thread RESOLUTION has no
# Actions trigger at all (see the pull_request_review_comment block below), and
# because event deliveries can be missed, runs can fail, and mergeability can still
# be UNKNOWN when a sweep gives up.
#
# WHY EVERY RUN SWEEPS EVERY OPEN PR, not just the one that triggered it:
# merging PR A is what creates the conflict on PRs B..F. The chips that need
# revoking are on the PRs that did NOT change, so a per-PR job would miss
# precisely the case this exists to catch. Sweeping everything also makes a run
# idempotent. It does NOT make a run safe to cancel — see the concurrency block.
#
# The predicate, the retry-on-UNKNOWN, and the grant/revoke asymmetry all live
# in scripts/ci/pr_readiness_labels.sh, which has its own 22-case suite wired
# into scripts/gate.sh. This file is only the trigger surface.

name: pr-readiness-labels

on:
  push:
    branches: [dev]     # a merge to dev is what conflicts every other open PR
  pull_request:
    # Faster revocation when a PR changes under a chip it already holds. Note a
    # push to a PR leaves its own checks pending, which is deliberately NOT
    # "ready" — so a chip may be revoked here and re-granted by the hourly sweep
    # once checks go green. Conservative on grant, immediate on revoke.
    # `edited` is here for RETARGETING: changing a PR's base branch arrives as
    # `edited`, and mergeability is recomputed against the new base, so a
    # retargeted PR can otherwise carry a wrong chip until the hourly sweep. No
    # check producer backstops it — ci.yml uses the default actions and
    # pr-preview.yml selects only opened/synchronize/reopened. `edited` also fires
    # on title and body edits, which cost one idempotent no-op sweep each.
    #
    # `labeled`/`unlabeled` catch DIRECT mutation of a managed chip — someone hand-
    # adding ready-to-merge to a blocked PR, or removing conflicts. No predicate
    # input changes when that happens, so nothing else would ever notice and the
    # wrong chip would sit on the index until the hourly sweep. This reconciler's
    # own writes also fire these, but the follow-up sweep sees a snapshot that
    # already matches the desired state, writes nothing, and therefore emits no
    # further event — it settles after one no-op rather than looping.
    types:
      [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited,
       labeled, unlabeled]
  # A new review finding changes the predicate but emits its OWN event — NOT one
  # of the pull_request types above. Without these two, a reviewer could raise a
  # blocking finding on a PR holding the chip and it would keep advertising
  # "ready" until the hourly sweep. Serialization cannot close a race when no run
  # is ever enqueued.
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, deleted]
  # NO TRIGGER FOR THREAD RESOLUTION. `pull_request_review_thread` (activity types
  # `resolved` / `unresolved`) is a real WEBHOOK event, but it is NOT among the events
  # that can start a workflow — the Actions events reference lists only
  # pull_request, pull_request_review, pull_request_review_comment and
  # pull_request_target in that family. Adding it here does not merely fail to fire:
  # it makes the whole workflow file invalid, and GitHub then records a
  # startup_failure for EVERY push, including branches this file's push filter
  # excludes. That is exactly what happened — the workflow was dead on dev until it
  # was removed again, so do not re-add it without checking the Actions list rather
  # than the webhook list. The two are not the same set.
  #
  # Consequence, stated plainly: resolving or un-resolving a thread changes the
  # predicate with no event to observe it, so the hourly sweep is the only thing that
  # picks it up. Issue #169 removes the need by making resolution the authoritative
  # signal and having the review loop resolve threads as it addresses them.
  # mergeStateStatus folds in CHECK state, so a check finishing — or a rerun of a
  # previously green check going red — changes the predicate while emitting no
  # pull_request event at all. Without this, a green PR stays unlabelled until the
  # hourly sweep, and worse, a failed rerun leaves ready-to-merge advertised for up
  # to an hour. These are the two workflows that produce PR checks here.
  #
  # NOT check_suite. GitHub's events reference: "To prevent recursive workflows,
  # this event does not trigger workflows if the check suite was created by GitHub
  # Actions or if the check suite's head SHA is associated with GitHub Actions."
  # These check suites are exactly that, so check_suite would never fire for them;
  # workflow_run is the mechanism that does.
  #
  # Three activity types, because a RERUN turns a green check pending and the PR
  # stops satisfying CLEAN before that rerun finishes — waiting only for
  # `completed` would leave a stale ready-to-merge advertised for its whole
  # duration. `in_progress` is the type that covers reruns: GitHub documents that
  # "the `requested` activity type does not occur when a workflow is re-run".
  # `requested` is still worth having for a NEW run, where it fires at queue time
  # and so lands earlier than `in_progress` on a busy runner.
  workflow_run:
    workflows: [gate, "PR Preview"]
    types: [requested, in_progress, completed]
  schedule:
    # Hourly, off the hour to avoid the rush. NOT merely a backstop: thread
    # resolution has no Actions trigger, so this sweep is the ONLY thing that ever
    # observes a thread being resolved or un-resolved. It also covers what events
    # cannot — a delivery that never arrived, a run that failed, or mergeability
    # still UNKNOWN when the previous sweep gave up.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and log, change no labels"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # SERIALIZE, do not cancel. An earlier draft used cancel-in-progress: true on the
  # reasoning that every run does the whole job, so losing one is harmless. That
  # covers lost WORK but not write ORDERING: a cancelled run can have a label write
  # already in flight, which may land AFTER the replacement run wrote from a newer
  # snapshot — leaving the stale decision as the final state, durably, until the
  # next sweep. Queueing removes the interleaving entirely, and a sweep costs
  # seconds. (GitHub keeps at most one run pending per group and cancels older
  # PENDING runs; those never started, so they cannot have written anything.)
  group: pr-readiness-labels
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # Any PR-scoped event on a FORK PR gets a read-only token, so the label write
    # would 403. Skip those rather than fail; the scheduled sweep runs in the base
    # repo with a write token and picks them up. Every open PR in this repo today
    # is same-repo (branches pushed to fasrc/archi directly).
    #
    # Keyed on the PAYLOAD, not the event name: pull_request, pull_request_review
    # and pull_request_review_comment all carry `pull_request`, while push,
    # schedule and workflow_dispatch carry none. An earlier version tested
    # `event_name != 'pull_request'`, which let both review events straight past
    # the guard and into a 403.
    if: >-
      github.event.pull_request == null ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # gh and jq are both preinstalled on ubuntu-latest — no toolchain step.
      - name: Reconcile readiness labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_LABELS_REPO: ${{ github.repository }}
          # Interpolated into an env var rather than into the run script, so the
          # shell never sees templated text.
          DRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: bash scripts/ci/pr_readiness_labels.sh ${DRY:+--dry-run}
