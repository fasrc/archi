# .github/workflows/pr-readiness-labels.yml — keep the PR index honest.
#
# The GitHub PR list renders the CI check rollup but never renders mergeability,
# so a conflicted PR with green checks looks IDENTICAL in the list to one that is
# genuinely ready to merge. On 2026-07-31 that hid a single deleted symlink
# (issue #168) which had left 6 of 7 open PRs unmergeable while every check
# stayed green and the nightly kept answering review findings that could never
# land. Labels are the only readiness signal the index renders, so this
# reconciles two of them on every event that can change the answer.
#
# WHY EVERY RUN SWEEPS EVERY OPEN PR, not just the one that triggered it:
# merging PR A is what creates the conflict on PRs B..F. The chips that need
# revoking are on the PRs that did NOT change, so a per-PR job would miss
# precisely the case this exists to catch. Sweeping everything also makes a run
# idempotent and safe to cancel — any single run does the whole job.
#
# The predicate, the retry-on-UNKNOWN, and the grant/revoke asymmetry all live
# in scripts/ci/pr_readiness_labels.sh, which has its own 16-case suite wired
# into scripts/gate.sh. This file is only the trigger surface.

name: pr-readiness-labels

on:
  push:
    branches: [dev]     # a merge to dev is what conflicts every other open PR
  pull_request:
    # Faster revocation when a PR changes under a chip it already holds. Note a
    # push to a PR leaves its own checks pending, which is deliberately NOT
    # "ready" — so a chip may be revoked here and re-granted by the hourly sweep
    # once checks go green. Conservative on grant, immediate on revoke.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # A new review finding changes the predicate but emits its OWN event — NOT one
  # of the pull_request types above. Without these two, a reviewer could raise a
  # blocking finding on a PR holding the chip and it would keep advertising
  # "ready" until the hourly sweep. Serialization cannot close a race when no run
  # is ever enqueued.
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created, deleted]
  schedule:
    # Hourly backstop, off the hour to avoid the rush. Still load-bearing: GitHub
    # emits NO workflow event when a review thread is RESOLVED, so resolution is
    # only ever picked up by this sweep.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and log, change no labels"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # SERIALIZE, do not cancel. An earlier draft used cancel-in-progress: true on the
  # reasoning that every run does the whole job, so losing one is harmless. That
  # covers lost WORK but not write ORDERING: a cancelled run can have a label write
  # already in flight, which may land AFTER the replacement run wrote from a newer
  # snapshot — leaving the stale decision as the final state, durably, until the
  # next sweep. Queueing removes the interleaving entirely, and a sweep costs
  # seconds. (GitHub keeps at most one run pending per group and cancels older
  # PENDING runs; those never started, so they cannot have written anything.)
  group: pr-readiness-labels
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # Any PR-scoped event on a FORK PR gets a read-only token, so the label write
    # would 403. Skip those rather than fail; the scheduled sweep runs in the base
    # repo with a write token and picks them up. Every open PR in this repo today
    # is same-repo (branches pushed to fasrc/archi directly).
    #
    # Keyed on the PAYLOAD, not the event name: pull_request, pull_request_review
    # and pull_request_review_comment all carry `pull_request`, while push,
    # schedule and workflow_dispatch carry none. An earlier version tested
    # `event_name != 'pull_request'`, which let both review events straight past
    # the guard and into a 403.
    if: >-
      github.event.pull_request == null ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # gh and jq are both preinstalled on ubuntu-latest — no toolchain step.
      - name: Reconcile readiness labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_LABELS_REPO: ${{ github.repository }}
          # Interpolated into an env var rather than into the run script, so the
          # shell never sees templated text.
          DRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
        run: bash scripts/ci/pr_readiness_labels.sh ${DRY:+--dry-run}
